<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 3.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-xl);
            z-index: 10;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-logo {
            margin-bottom: 1.5rem;
            display: inline-flex;
        }
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Floating shapes for background aesthetics -->
        <div style="position: absolute; width: 400px; height: 400px; background: var(--primary); border-radius: 50%; top: -100px; right: -100px; opacity: 0.1; filter: blur(80px);"></div>
        <div style="position: absolute; width: 300px; height: 300px; background: var(--secondary); border-radius: 50%; bottom: -100px; left: -100px; opacity: 0.1; filter: blur(80px);"></div>

        <div class="auth-card animate-fade">
            <div class="auth-header">
                <div class="auth-logo">
                    <div style="width: 50px; height: 50px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </div>
                </div>
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
                <p style="color: var(--text-muted);">Securely sign in to your account</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger" style="font-size: 0.85rem; padding: 0.75rem 1rem;">
                Invalid username or password.
            </div>
            <div th:if="${message}" class="alert alert-success" style="font-size: 0.85rem; padding: 0.75rem 1rem;" th:text="${message}"></div>

            <form id="loginForm" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username or email" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register now</a>
            </div>
        </div>
    </div>
    <!-- Power Toggle System -->
    <div id="power-toggle">
        <div class="power-lamp" id="powerLamp">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C13.1 2 14 2.9 14 4V5H16V7H13V19H16V21H8V19H11V7H8V5H10V4C10 2.9 10.9 2 12 2M12 4V5H12V4Z"/>
            </svg>
        </div>
    </div>

    <div th:insert="~{chatbot :: chatbotWidget}"></div>
    <script th:src="@{/js/script.js?v=2}"></script>
</body>
</html>
