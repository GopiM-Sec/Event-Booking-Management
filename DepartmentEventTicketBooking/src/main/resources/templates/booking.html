<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Booking | EventSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-logo">
            <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            EventSphere
        </a>
    </nav>

    <div class="container">
        <div class="hero animate-fade">
            <h1 style="font-size: 2.5rem;">Complete Your Booking</h1>
            <p th:text="${event.name}">Event Name</p>
        </div>

        <div th:if="${error}" class="alert alert-danger animate-fade" style="max-width: 600px; margin: 0 auto 2rem; padding: 1.25rem; background: #FFF1F2; border: 1px solid #FECDD3; color: #BE123C; border-radius: var(--radius-md); font-weight: 600;" th:text="${error}">
            Error message
        </div>

        <div class="form-card animate-fade">
            <form id="bookingForm" th:action="@{/book}" th:object="${booking}" method="post">
                <input type="hidden" name="eventId" th:value="${event.id}">
                <input type="hidden" id="availableTickets" th:value="${event.availableTickets}">
                
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" th:field="*{userName}" class="form-control" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Corporate Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="jane@company.com" required>
                </div>

                <div class="form-group">
                    <label for="department">Your Department</label>
                    <select id="department" th:field="*{department}" class="form-control" required>
                        <option value="" disabled selected>Choose department</option>
                        <option value="IT">Information Technology</option>
                        <option value="HR">Human Resources</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numberOfTickets">Quantity</label>
                    <input type="number" id="numberOfTickets" th:field="*{numberOfTickets}" class="form-control" min="1" th:max="${event.availableTickets}" value="1" required>
                    <input type="hidden" id="ticketPriceValue" th:value="${event.ticketPrice}">
                    <p style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--text-muted); font-weight: 500;" th:text="'Only ' + ${event.availableTickets} + ' spots left for this event'"></p>
                </div>

                <div style="background: var(--background); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 700; color: var(--text-muted);">Estimated Total</span>
                    <span id="totalPriceDisplay" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);" th:text="${event.ticketPrice == 0 ? 'FREE' : '₹' + event.ticketPrice}">₹250</span>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()" style="flex: 1;">Clear Form</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Confirm Reservation</button>
                </div>
            </form>
        </div>
    </div>

    <div th:insert="~{chatbot :: chatbotWidget}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
