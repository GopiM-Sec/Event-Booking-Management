<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | EventSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .ticket {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }
        .ticket-top {
            padding: 3rem 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            text-align: center;
        }
        .ticket-bottom {
            padding: 3rem;
            position: relative;
        }
        .ticket-bottom::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            right: 0;
            height: 30px;
            background-image: radial-gradient(circle at 15px 15px, transparent 15px, var(--surface) 15px);
            background-size: 30px 30px;
            background-position: -15px -15px;
        }
        .qr-placeholder {
            width: 120px;
            height: 120px;
            background: #f1f5f9;
            margin: 0 auto 2rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-logo">
            <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            EventSphere
        </a>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="ticket animate-fade">
            <div class="ticket-top">
                <div style="width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h1 style="font-size: 2rem; color: white; margin-bottom: 0.5rem;">Booking Confirmed!</h1>
                <p style="opacity: 0.9; font-weight: 500;">Ticket ID: #EVT-<span th:text="${bookingConfirmed.id + 1000}">1042</span></p>
            </div>
            
            <div class="ticket-bottom">
                <div class="qr-placeholder">
                    <!-- Simple Mock QR Representation -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;">
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--border);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--border);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--border);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--border);"></div>
                        <div style="width: 15px; height: 15px; background: var(--text-main);"></div>
                        <div style="width: 15px; height: 15px; background: var(--border);"></div>
                    </div>
                </div>

                <div style="text-align: left; margin-bottom: 3rem;">
                    <div style="margin-bottom: 1.5rem;">
                        <span class="meta-label">Event Name</span>
                        <div style="font-size: 1.25rem; font-weight: 800; color: var(--text-main);" th:text="${bookingConfirmed.eventName}">Annual Gala 2024</div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div>
                            <span class="meta-label">Attendee</span>
                            <div style="font-weight: 700; color: var(--text-main);" th:text="${bookingConfirmed.userName}">John Doe</div>
                        </div>
                        <div>
                            <span class="meta-label">Department</span>
                            <div style="font-weight: 700; color: var(--text-main);" th:text="${bookingConfirmed.department}">Engineering</div>
                        </div>
                        <div>
                            <span class="meta-label">Quantity</span>
                            <div style="font-weight: 700; color: var(--text-main);" th:text="${bookingConfirmed.numberOfTickets} + ' Tickets'">2 Tickets</div>
                        </div>
                        <div>
                            <span class="meta-label">Amount Paid</span>
                            <div style="font-weight: 700; color: var(--primary-dark);" th:text="${bookingConfirmed.totalAmount == 0 ? 'FREE' : '₹' + bookingConfirmed.totalAmount}">₹500</div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <a href="/" class="btn btn-primary" style="flex: 2;">Finish & Exit</a>
                    <button onclick="window.print()" class="btn btn-secondary" style="flex: 1;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 2rem; font-weight: 500;">
            A confirmation email has been sent to <span style="color: var(--text-main); font-weight: 700;" th:text="${bookingConfirmed.email}">email@example.com</span>
        </p>
    </div>

    <div th:insert="~{chatbot :: chatbotWidget}"></div>
</body>
</html>
