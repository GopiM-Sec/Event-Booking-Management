<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking OTP | EventSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .auth-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 3.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-xl);
            z-index: 10;
            text-align: center;
        }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 2rem 0;
        }
        .otp-inputs input {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--background);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .otp-inputs input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .resend-link {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 0.9rem;
            text-decoration: underline;
        }
        #countdown { font-weight: 700; color: var(--text-muted); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-logo">
            <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            EventSphere
        </a>
    </nav>

    <div class="auth-container">
        <div style="position: absolute; width: 400px; height: 400px; background: var(--primary); border-radius: 50%; top: -100px; right: -100px; opacity: 0.08; filter: blur(80px);"></div>
        <div style="position: absolute; width: 300px; height: 300px; background: var(--secondary); border-radius: 50%; bottom: -100px; left: -100px; opacity: 0.08; filter: blur(80px);"></div>

        <div class="auth-card animate-fade">
            <!-- Icon -->
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg,#6366f1,#4f46e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 8px 20px rgba(99,102,241,0.3);">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
                </svg>
            </div>

            <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Confirm Your Booking</h1>
            <p style="color: var(--text-muted); margin-bottom: 0.25rem;">We sent a 6-digit OTP to</p>
            <p style="font-weight: 700; color: var(--text-main); margin-bottom: 0;" th:text="${maskedEmail}">e***e@gmail.com</p>

            <!-- Alerts -->
            <div th:if="${error}" class="alert alert-danger" style="margin-top: 1.5rem; font-size: 0.85rem;" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" style="margin-top: 1.5rem; font-size: 0.85rem;" th:text="${message}"></div>

            <!-- OTP Form -->
            <form th:action="@{/verify-booking-otp}" method="post" id="otpForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                </div>
                <input type="hidden" name="otp" id="otpHidden">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Verify & Confirm Booking</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Didn't receive it? Resend in <span id="countdown">60</span>s
            </p>

            <form th:action="@{/resend-booking-otp}" method="post" id="resendForm" style="display:none;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="resend-link">Resend OTP</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.85rem;">
                <a href="/" style="color: var(--text-muted); text-decoration: none;">← Cancel Booking</a>
            </p>
        </div>
    </div>

    <script>
        const boxes = document.querySelectorAll('.otp-box');
        boxes.forEach((box, i) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '');
                if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
                updateHidden();
            });
            box.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
            });
            box.addEventListener('paste', e => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                [...text].slice(0, 6).forEach((ch, j) => { if (boxes[j]) boxes[j].value = ch; });
                updateHidden();
                const next = Math.min(text.length, 5);
                boxes[next].focus();
            });
        });

        function updateHidden() {
            document.getElementById('otpHidden').value = [...boxes].map(b => b.value).join('');
        }

        document.getElementById('otpForm').addEventListener('submit', e => {
            updateHidden();
            const val = document.getElementById('otpHidden').value;
            if (val.length !== 6) { e.preventDefault(); alert('Please enter all 6 digits.'); }
        });

        let seconds = 60;
        const countdownEl = document.getElementById('countdown');
        const resendForm  = document.getElementById('resendForm');
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                countdownEl.parentElement.style.display = 'none';
                resendForm.style.display = 'block';
            }
        }, 1000);
    </script>
</body>
</html>
